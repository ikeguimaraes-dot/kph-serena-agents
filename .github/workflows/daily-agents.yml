name: Orkestri — Serena Daily Agents

on:
  schedule:
    - cron: '0 9 * * *'  # 06h BRT
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agente a executar (all = todos)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - reservas
          - funil
          - nps
          - handoffs
          - learning
          - scorer

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run agents
        run: |
          AGENT="${{ github.event.inputs.agent || 'all' }}"
          if [ "$AGENT" = "all" ]; then
            npm run run:all
          else
            npm run run:$AGENT
          fi
        env:
          SERENA_DATABASE_URL: ${{ secrets.SERENA_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_ORQUESTRADOR: ${{ secrets.DISCORD_WEBHOOK_ORQUESTRADOR }}
          # Sprint Orkestri — clusterização ao final do run (learning-machine)
          ADMIN_SECRET: ${{ secrets.SERENA_ADMIN_SECRET }}
          SERENA_API_URL: ${{ secrets.SERENA_BACKEND_URL }}

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_ORQUESTRADOR }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **Orkestri falhou** — ${{ github.workflow }} em ${{ github.run_id }}\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"
